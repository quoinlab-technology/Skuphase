[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skuphase"
version = "0.1.0"
description = "AI-powered exam generation backend for Nigerian schools (FastAPI + PostgreSQL, curriculum-first)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "python-fasthtml",
    "faststrap",
    "bleach",
    "markdown",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg2-binary",
    "alembic",
    "passlib[bcrypt]",
    "bcrypt",
    "python-jose[cryptography]",
    "cryptography",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "openai",
    "aiosmtplib",
    "httpx",
    "reportlab",
    "svglib",
    "python-dotenv",
    "python-docx",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
